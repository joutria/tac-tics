<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tac-tics</title>
  <style>
    :root { color-scheme: dark; --bg: #1d1f2b; --panel: rgba(20, 22, 32, 0.88); --ink: #f2efe6; --quiet: #a9a7b8; --accent: #ffd86b; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, sans-serif; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
    #hud { position: fixed; left: 0; right: 0; top: 0; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
      padding: max(10px, env(safe-area-inset-top)) 16px 10px; background: var(--panel); }
    #turn { font-weight: 600; }
    #stats, #hint { color: var(--quiet); }
    #hint { flex-basis: 100%; font-size: 13px; }
    .spacer { flex: 1; }
    button { font: inherit; color: var(--ink); background: #3a3d55; border: 1px solid #5a5e80; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
    button.primary { background: #6b5a1e; border-color: var(--accent); }
    button:disabled { opacity: 0.5; cursor: default; }
    #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--panel); padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .3s; pointer-events: none; }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <span id="turn"></span><span id="stats"></span>
    <span class="spacer"></span>
    <button id="lang"></button>
    <button id="new"></button>
    <button id="end" class="primary"></button>
    <span id="hint"></span>
  </div>
  <div id="toast"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
