<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tac-tics</title>
  <style>
    /* Handheld-style windows: a dark grey body in a gold pixel frame (the CC0 Golden UI pack, see the pixel skin at the
       end), a pixel font, a pointing hand on the item in focus. Every window shares the .win look; buttons inside the
       battle menus are rows (.cmd). */
    :root {
      color-scheme: dark; --bg: #15121c; --ink: #f5eedb; --quiet: #cfc6d6; --accent: #ffd96b; --hero: #ffe680; --foe: #ff9c8c;
      --win-top: #4e4a4e; --win-mid: #4e4a4e; --win-bot: #4e4a4e; --frame: #d27d2c; --rim: #140c1c;
      --panel: #4e4a4e;
      --px: "Pixelify Sans", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.3 var(--px); overflow: hidden; -webkit-user-select: none; user-select: none; }
    canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
    img.ico { width: 16px; height: 16px; image-rendering: pixelated; vertical-align: -3px; flex: none; }
    img.ico.big { width: 24px; height: 24px; vertical-align: -6px; }
    img.ico.huge { width: 32px; height: 32px; }
    .win { background: var(--panel); border: 2px solid var(--frame); border-radius: 8px; color: var(--ink); text-shadow: 1px 1px 0 var(--rim);
      box-shadow: 0 0 0 2px var(--rim), inset 0 0 0 1px rgba(255,255,255,0.18), 0 6px 18px rgba(0,0,0,0.55); }
    /* The bars hold windows; empty parts let taps through to the map. */
    .bar { position: fixed; left: 0; right: 0; display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; padding: 8px 10px; pointer-events: none; z-index: 2; }
    .bar > * { pointer-events: auto; }
    .bar > .spacer { pointer-events: none; }
    #top { top: 0; padding-top: max(8px, env(safe-area-inset-top)); }
    #bottom { bottom: 0; padding-bottom: max(8px, env(safe-area-inset-bottom)); align-items: flex-end; }
    .spacer { flex: 1; }
    /* The unit in play: face, name, element, HP / AP / MP. */
    #unitCard { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; align-items: center; padding: 6px 10px 6px 6px; min-width: 210px; }
    #unitCard .face { grid-row: span 3; width: 44px; height: 44px; border-radius: 6px; background: rgba(0,0,0,0.3); border: 2px solid var(--frame); image-rendering: pixelated; object-fit: contain; }
    #unitCard .name { display: flex; gap: 6px; align-items: center; font-size: 16px; font-weight: 600; }
    #unitCard .name.foes { color: var(--foe); } #unitCard .name.heroes { color: var(--hero); }
    #unitCard .round { margin-left: auto; font-size: 12px; color: var(--quiet); font-weight: 400; }
    .gauge { display: flex; align-items: center; gap: 5px; font-size: 12px; }
    .gauge .track { position: relative; width: 96px; height: 8px; background: var(--rim); border: 1px solid rgba(255,255,255,0.35); border-radius: 2px; }
    .gauge .fill { position: absolute; inset: 0 auto 0 0; background: linear-gradient(#a4f07c, #4fb03a); }
    .gauge .fill.low { background: linear-gradient(#ffd27a, #d98a1c); } .gauge .fill.crit { background: linear-gradient(#ff8a7a, #c0392b); }
    .pips { display: flex; gap: 2px; } .pips i { width: 7px; height: 9px; background: var(--rim); border: 1px solid rgba(255,255,255,0.3); border-radius: 1px; }
    .pips.ap i.on { background: linear-gradient(#fff2a0, #e0a02a); } .pips.mp i.on { background: linear-gradient(#bfe6ff, #3f8ad8); }
    .gauge b { min-width: 46px; font-weight: 400; }
    /* View tools, top right: the two turns of the map, and a fold-out menu for the rest. */
    #tools { display: flex; gap: 2px; padding: 3px; align-items: center; }
    .fold { position: relative; display: inline-flex; }
    .fold-list { position: absolute; top: calc(100% + 8px); right: -3px; display: none; flex-direction: column; padding: 5px 4px; min-width: 190px; z-index: 8; }
    .fold.open .fold-list { display: flex; }
    .fold-list button.cmd, #travelTools .fold-list button.cmd { justify-content: flex-start; padding-left: 24px; }
    .fold-btn .lbl { display: none; }
    #travelTools { display: flex; gap: 2px; padding: 3px; align-items: center; }
    /* Turn order: a row of faces; the one acting now is bigger, framed in gold, with the turn arrow over it. */
    #top > .spacer { order: 2; } #tools { order: 3; }
    #queue { order: 1; display: flex; gap: 3px; flex: 0 1 auto; min-width: 0; overflow-x: auto; align-items: center; padding: 4px 6px; scrollbar-width: none; }
    #queue .label { display: none; }
    /* One window for the unit in play and the turn order (FFTA keeps them together), split by a thin gold rule. */
    #head { order: 1; display: flex; align-items: center; min-width: 0; padding: 0; }
    #head #queue { align-self: stretch; border-left: 1px solid rgba(255, 214, 107, 0.28); }
    .chip { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; padding: 0; flex: none; border-radius: 5px; border: 2px solid;
      background: rgba(11,16,51,0.6); box-shadow: none; cursor: pointer; }
    .chip img { width: 24px; height: 24px; image-rendering: pixelated; }
    .chip.heroes { border-color: var(--hero); } .chip.foes { border-color: var(--foe); background: rgba(70,12,20,0.55); }
    .chip.now { width: 36px; height: 36px; background: rgba(255, 224, 107, 0.3); box-shadow: 0 0 0 2px var(--rim); margin-right: 4px; }
    .chip.now img { width: 30px; height: 30px; }
    .chip .mark { position: absolute; right: -3px; bottom: -4px; font-size: 10px; line-height: 1; text-shadow: 1px 1px 0 var(--rim); }
    /* Buttons: bevelled blue tiles with a cream frame; the green one confirms, the gold one ends the turn. */
    button { font: inherit; color: var(--ink); text-shadow: 1px 1px 0 var(--rim); background: linear-gradient(#4f74d6, #2b479f); border: 2px solid var(--frame);
      border-radius: 6px; padding: 5px 10px; cursor: pointer; box-shadow: 0 0 0 1px var(--rim), inset 0 -2px 0 rgba(0,0,0,0.25); display: inline-flex; align-items: center; gap: 5px;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    button:hover:not(:disabled) { filter: brightness(1.15); }
    button:active:not(:disabled) { transform: translateY(1px); }
    button.primary { background: linear-gradient(#e6b84a, #a8741c); }
    button.go { background: linear-gradient(#5bc46a, #2a7d38); font-weight: 600; }
    button.on, button.armed { background: linear-gradient(#e0644f, #8e2a22); }
    button:disabled { opacity: 0.45; cursor: default; filter: grayscale(0.6); }
    button.icon { min-width: 34px; min-height: 34px; padding: 3px; justify-content: center; }
    button.icon img.ico { width: 22px; height: 22px; }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
    /* Inside a window, buttons are plain items (one frame per window, not one per button), lit up under the pointer. */
    .win button.icon, .win button.flat, #system .row button { background: none; border: 2px solid transparent; box-shadow: none; border-radius: 5px; }
    .win button.icon:hover:not(:disabled), .win button.flat:hover:not(:disabled), #system .row button:hover:not(:disabled) { background: rgba(255,255,255,0.14); filter: none; }
    .win button.icon.on, #system .row button.on, #system .row button.armed { background: rgba(224, 100, 79, 0.55); border-color: rgba(255,180,160,0.6); }
    .fold.open > .fold-btn { background: rgba(255, 224, 107, 0.25); }
    /* The command menu: one row per ability, tinted by its element, the hand on the one in focus or chosen. */
    #menu { display: flex; flex-direction: column; padding: 6px 4px; min-width: 230px; max-height: 46vh; overflow-x: hidden; overflow-y: auto; }
    #menu h3 { margin: 0 8px 4px 22px; font-size: 13px; font-weight: 400; color: var(--quiet); letter-spacing: 0.5px; }
    #abilities { display: flex; flex-direction: column; gap: 2px; }
    button.cmd { background: none; border: 0; box-shadow: none; border-radius: 4px; padding: 3px 8px 3px 22px; position: relative; width: 100%; justify-content: flex-start; gap: 7px; min-height: 32px; text-align: left; }
    #abilities button.cmd { --el: #b8b4a8; background: linear-gradient(90deg, color-mix(in srgb, var(--el) 30%, transparent), transparent 85%); box-shadow: inset 3px 0 0 var(--el); }
    button.cmd .nm { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    button.cmd .cost { display: inline-flex; gap: 2px; align-items: center; font-size: 13px; color: var(--accent); white-space: nowrap; }
    button.cmd .cost.cd { color: var(--quiet); }
    button.cmd:hover:not(:disabled), button.cmd:focus-visible, button.cmd.on { background: rgba(255,255,255,0.14); filter: none; outline: none; }
    #abilities button.cmd:hover:not(:disabled), #abilities button.cmd:focus-visible { background: linear-gradient(90deg, color-mix(in srgb, var(--el) 50%, transparent), rgba(255,255,255,0.1)); }
    #abilities button.cmd.on { background: linear-gradient(90deg, color-mix(in srgb, var(--el) 60%, transparent), rgba(255, 224, 107, 0.25)); box-shadow: inset 3px 0 0 var(--el), inset 0 0 0 1px var(--accent); }
    button.cmd:hover::before, button.cmd:focus-visible::before, button.cmd.on::before { content: ""; position: absolute; left: 0; top: 50%; width: 20px; height: 20px; margin-top: -10px;
      background: var(--pointer) center / contain no-repeat; image-rendering: pixelated; animation: nudge 0.6s steps(2) infinite; }
    @media (hover: none) { button.cmd:hover:not(.on)::before { content: none; } button.cmd:hover:not(:disabled):not(.on) { background: none; } #abilities button.cmd:hover:not(:disabled):not(.on) { background: linear-gradient(90deg, color-mix(in srgb, var(--el) 30%, transparent), transparent 85%); } }
    /* FFTA-style sets: a set's row ends in ▸ and opens it in place; the open set's top row (◂) goes back. */
    button.cmd.set .nm::after { content: " ▸"; color: var(--quiet); }
    button.cmd.back { color: var(--accent); min-height: 28px; box-shadow: 0 1px 0 rgba(236, 230, 210, 0.22); border-radius: 0; margin-bottom: 2px; }
    button.cmd.back .nm::before { content: "◂ "; }
    button.cmd:disabled { opacity: 0.4; }
    .fold-list button.cmd { min-height: 36px; }
    @keyframes nudge { 50% { transform: translateX(3px); } }
    #system { display: flex; flex-direction: column; gap: 4px; padding: 5px; align-items: stretch; }
    #system .row { display: flex; gap: 2px; }
    #system button { justify-content: flex-start; }
    #system #end { justify-content: center; font-weight: 600; min-height: 38px; }
    #hint { position: fixed; left: 50%; transform: translateX(-50%); font-size: 12px; color: var(--quiet); text-shadow: 1px 1px 0 #000; pointer-events: none; text-align: center; max-width: 90vw; z-index: 1; }
    /* Help: what the item under the pointer, in focus or held down does, in a popup right next to it. */
    #help { position: fixed; width: min(440px, calc(100vw - 12px)); padding: 7px 12px 8px; display: none; z-index: 9; pointer-events: none; --caret: 50%; }
    #help::after { content: ""; position: absolute; width: 10px; height: 10px; background: var(--win-bot); border: 2px solid var(--frame); border-width: 0 2px 2px 0; }
    #help[data-caret="below"]::after { left: var(--caret); bottom: -7px; margin-left: -5px; transform: rotate(45deg); }
    #help[data-caret="above"]::after { left: var(--caret); top: -7px; margin-left: -5px; transform: rotate(225deg); background: var(--win-top); }
    #help[data-caret="right"]::after { top: var(--caret); right: -7px; margin-top: -5px; transform: rotate(-45deg); background: var(--win-mid); }
    #help[data-caret="left"]::after { top: var(--caret); left: -7px; margin-top: -5px; transform: rotate(135deg); background: var(--win-mid); }
    #help .head { display: flex; align-items: center; gap: 7px; font-size: 16px; font-weight: 600; color: var(--accent); }
    #help .chips { display: flex; flex-wrap: wrap; gap: 4px 10px; margin: 4px 0 3px; font-size: 13px; }
    #help .chips span { display: inline-flex; align-items: center; gap: 3px; }
    #help p { margin: 0; font-size: 14px; line-height: 1.35; }
    #help .why { color: #ffb3a6; margin-top: 3px; }
    #help .body { display: flex; gap: 10px; align-items: flex-start; }
    #help .rules { font-size: 12px; color: var(--quiet); margin-top: 2px; }
    #help .shape { --c: 6px; display: grid; gap: 1px; flex: none; margin-top: 2px; padding: 3px; background: rgba(0,0,0,0.25); border-radius: 3px; }
    #help .shape i { width: var(--c); height: var(--c); background: rgba(255,255,255,0.07); }
    #help .shape .in { background: #e8735f; } #help .shape .ar { background: #ffb347; } #help .shape .me { background: #ffe06b; }
    #help .shape .no { background: rgba(0,0,0,0.45); box-shadow: inset 0 0 0 1px rgba(255,170,150,0.45); }
    #help kbd { font: 11px var(--px); padding: 0 4px; border: 1px solid var(--frame); border-radius: 3px; background: rgba(0,0,0,0.3); margin-left: 6px; color: var(--quiet); }
    /* The ability being used, called out at the top (FFTA style). */
    #callout { position: fixed; left: 50%; transform: translate(-50%, -8px); display: flex; align-items: center; gap: 8px; padding: 6px 16px 6px 10px; z-index: 4;
      pointer-events: none; opacity: 0; transition: opacity .15s, transform .15s; font-size: 18px; font-weight: 600; white-space: nowrap; }
    #callout.show { opacity: 1; transform: translate(-50%, 0); }
    #callout span { display: flex; flex-direction: column; line-height: 1.1; } #callout small { font-size: 11px; font-weight: 400; color: var(--quiet); }
    #callout.foes { border-color: #ffb3a6; } #callout.foes span { color: #ffd0c8; }
    /* Floats just above the bottom bar so showing it never shifts the map under the player's finger. */
    #act { position: fixed; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; pointer-events: none; z-index: 3; }
    #act button { pointer-events: auto; padding: 9px 16px; font-size: 16px; box-shadow: 0 0 0 2px var(--rim), 0 4px 14px rgba(0,0,0,0.5); }
    /* The target card (FFTA unit windows, Fire Emblem forecast): the one acting and the one aimed at, face to face,
       then hit, damage and crit, and the HP bar after the hit: solid what is left, blinking what it may take,
       hollow what it surely takes. A skull and a red rim when the hit downs the target. */
    #target { position: fixed; left: 50%; transform: translate(-50%, -6px); width: min(460px, calc(100vw - 12px)); padding: 6px 10px 7px; z-index: 4;
      pointer-events: none; opacity: 0; visibility: hidden; transition: opacity .12s, transform .12s; font-size: 13px; }
    #target.show { opacity: 1; visibility: visible; transform: translate(-50%, 0); }
    #target .faces { display: flex; align-items: center; gap: 6px; }
    #target .side { flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 6px; }
    #target .side.them { flex-direction: row-reverse; text-align: right; }
    #target .face { width: 40px; height: 40px; flex: none; image-rendering: pixelated; border: 2px solid var(--hero); background: rgba(11,16,51,0.6); }
    #target .side.foes .face { border-color: var(--foe); background: rgba(70,12,20,0.55); }
    #target .who { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 1px; }
    #target .name { display: flex; align-items: center; gap: 4px; font-weight: 600; color: var(--accent); white-space: nowrap; overflow: hidden; }
    #target .name span { overflow: hidden; text-overflow: ellipsis; }
    #target .side.them .name, #target .side.them .gauge { flex-direction: row-reverse; }
    #target .side.foes .name { color: #ffd0c8; }
    #target .gauge .track { width: 100%; flex: 1; position: relative; }
    #target .gauge .maybe { position: absolute; top: 0; bottom: 0; background: linear-gradient(#ffd27a, #d98a1c); animation: tc-blink 0.8s steps(2) infinite; }
    #target .gauge .lost { position: absolute; top: 0; bottom: 0; box-shadow: inset 0 0 0 1px rgba(255, 138, 122, 0.8); background: rgba(192, 57, 43, 0.25); }
    #target .gauge .gain { position: absolute; top: 0; bottom: 0; background: linear-gradient(#d4ffb8, #7fd65a); animation: tc-blink 0.8s steps(2) infinite; }
    #target .side.them .gauge .track { transform: scaleX(-1); }
    #target .hpnum { font-size: 12px; color: var(--quiet); white-space: nowrap; }
    #target .hpnum b { color: var(--ink); font-size: 14px; } #target .hpnum b.up { color: #a4f07c; }
    #target .hpnum .arrow { font-style: normal; color: var(--accent); }
    #target .hpnum b.ko { color: #ff8a7a; display: inline-flex; align-items: center; gap: 2px; } #target .hpnum b.ko img.ico { width: 14px; height: 14px; }
    #target .mid { flex: none; display: flex; flex-direction: column; align-items: center; max-width: 84px; text-align: center; font-size: 11px; line-height: 1.1; color: var(--ink); }
    #target .mid img.ico.big { width: 26px; height: 26px; }
    #target .mid span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 84px; }
    #target .mid .go { font-style: normal; color: var(--accent); letter-spacing: -2px; animation: nudge 0.6s steps(2) infinite; }
    #target .nums { display: flex; justify-content: center; align-items: baseline; gap: 4px 14px; margin-top: 5px; padding-top: 4px; border-top: 1px solid rgba(255, 214, 107, 0.28); flex-wrap: wrap; }
    #target .stat { display: inline-flex; align-items: baseline; gap: 4px; } #target .stat small { color: var(--quiet); font-size: 12px; }
    #target .stat b { font-size: 17px; color: var(--ink); } #target .stat.dmg b { color: #ffe06b; } #target .stat.up b { color: #a4f07c; }
    #target .nums em { font-style: normal; font-size: 12px; } #target .nums em.up { color: #a4f07c; } #target .nums em.dn { color: #ffb3a6; }
    #target .sum { display: flex; justify-content: center; margin-top: 2px; font-size: 12px; }
    #target .verdict { display: flex; justify-content: center; align-items: center; gap: 5px; margin-top: 3px; }
    #target .down { color: #ffb3a6; } #target .quiet { color: var(--quiet); font-size: 12px; } #target b { font-weight: 600; }
    #target .skull img.ico { width: 20px; height: 20px; }
    #target .facebox { position: relative; flex: none; display: inline-flex; }
    #target .ko-badge { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(60, 8, 12, 0.55); }
    #target .ko-badge img.ico { width: 75%; height: 75%; animation: tc-blink 0.8s steps(2) infinite; }
    #target.kills { filter: drop-shadow(0 0 0 #ff8a7a); } #target.kills .side.them .face { border-color: #ff8a7a; box-shadow: 0 0 0 2px #8e2a22; }
    #target.low { transform: translate(0, 6px); } #target.low.show { transform: none; }
    @media (max-width: 720px), (max-height: 560px) {
      #target { padding: 4px 8px 5px; font-size: 12px; } #target .face { width: 32px; height: 32px; }
      #target .stat b { font-size: 15px; } #target .nums { margin-top: 3px; padding-top: 3px; } #target .mid img.ico.big { width: 22px; height: 22px; }
      #target .mid, #target .mid span { max-width: 64px; }
    }
    @keyframes tc-blink { 50% { opacity: 0.35; } }
    #tip { position: fixed; pointer-events: none; padding: 6px 9px; font-size: 13px; max-width: 270px; display: none; z-index: 4; }
    #tip b { color: var(--accent); }
    #tip .quiet { color: var(--quiet); }
    #tip .down { color: #ffb3a6; }
    #tip .hg { color: #ffd27a; }
    #tip .ok { color: #ffd0c0; }
    #overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(5,8,25,0.6); flex-direction: column; gap: 14px; }
    #overlay h1 { margin: 0; font-size: 44px; letter-spacing: 2px; color: var(--accent); text-shadow: 3px 3px 0 var(--rim), 0 0 18px rgba(255,224,107,0.5); }
    #mercy { display: flex; flex-direction: column; gap: 8px; align-items: stretch; max-width: min(420px, calc(100vw - 32px)); max-height: 50vh; overflow-y: auto; padding: 12px; }
    #mercy:empty { display: none; }
    #mercy h2 { margin: 0; font-size: 18px; text-align: center; color: var(--accent); }
    #mercy p { margin: 0; font-size: 13px; color: var(--quiet); text-align: center; }
    #mercy .foe { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.2); border-radius: 6px; padding: 6px 8px; }
    #mercy .foe img { width: 32px; height: 32px; image-rendering: pixelated; }
    #mercy .foe span { flex: 1; }
    #mercy .foe button { min-height: 40px; }
    #toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 8px 16px; opacity: 0; transition: opacity .3s; pointer-events: none; white-space: pre-line; text-align: center; max-width: 90vw; }
    #toast.show { opacity: 1; }
    .esc { color: #ffc85a; }
    .rival { color: #e2b8ff; }
  #travel { position: fixed; inset: 0; display: none; pointer-events: none; z-index: 3; }
  #travel .bar, #runmap .bar { pointer-events: none; }
  #travelTop, #routeTop { top: 0; padding-top: max(8px, env(safe-area-inset-top)); align-items: center; }
  #travelBottom, #routeBottom { bottom: 0; padding-bottom: max(8px, env(safe-area-inset-bottom)); align-items: flex-end; }
  #runHead { font-size: 14px; padding: 6px 10px; } #runHead b { color: var(--accent); }
  #runHead:empty, #runHintBox:has(#runHint:empty) { display: none; }
  #runHintBox, #routeHintBox { padding: 6px 12px; max-width: min(640px, 100%); }
  #runHint, #routeHint { color: var(--ink); font-size: 14px; white-space: pre-line; }
  #routeKeys { color: var(--quiet); font-size: 12px; }
  #routeTitleBox { padding: 6px 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; } #routeTitle { color: var(--accent); }
  #runmap { position: fixed; inset: 0; display: none; pointer-events: none; z-index: 5; }
  body.mapopen #top, body.mapopen #bottom, body.mapopen #act, body.mapopen #travel, body.mapopen #overlay, body.mapopen #tip, body.mapopen #help, body.mapopen #hint, body.mapopen #callout, body.mapopen #target { display: none !important; }
  #signs { position: absolute; inset: 0; pointer-events: none; }
  .sign { position: absolute; pointer-events: auto; display: flex; flex-direction: column; align-items: center; gap: 1px;

    background: radial-gradient(ellipse at 50% 45%, #2a2236, #0b0910 75%); transition: opacity 0.4s ease-out; }

  /* Camp stations: three big tiles, each a place at the fire, with a badge for what is new. */

<body>
  <!-- Boot splash: shown from the first paint until the art has loaded and the title opens (main.ts hides it). -->

          <button id="flat" class="cmd"></button><button id="danger" class="cmd"></button>
          <button id="lang" class="cmd"></button><button id="sound" class="cmd"></button><button id="toTitle" class="cmd"></button>

  <div id="help" class="win" role="status" aria-live="polite"></div>
  <div id="callout" class="win" aria-live="polite"></div>
  <div id="target" class="win" role="status"></div>

  <div id="act"><button id="cancel"></button><button id="confirm" class="go"></button></div>
  <div id="tip" class="win"></div>
