<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tac-tics</title>
  <style>
    :root { color-scheme: dark; --bg: #1d1f2b; --panel: rgba(20, 22, 32, 0.9); --ink: #f2efe6; --quiet: #a9a7b8; --accent: #ffd86b; --hero: #ffe680; --foe: #ff8a7a; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.35 system-ui, sans-serif; overflow: hidden; -webkit-user-select: none; user-select: none; }
    canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
    .bar { position: fixed; left: 0; right: 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 12px; background: var(--panel); }
    #top { top: 0; padding-top: max(8px, env(safe-area-inset-top)); }
    #bottom { bottom: 0; padding-bottom: max(8px, env(safe-area-inset-bottom)); }
    #turn { font-weight: 600; }
    #stats { color: var(--quiet); }
    #queue { display: flex; gap: 4px; flex-basis: 100%; overflow-x: auto; align-items: center; color: var(--quiet); font-size: 12px; }
    .chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px 1px 3px; border-radius: 999px; border: 1px solid; white-space: nowrap; font-size: 12px; background: transparent; }
    .chip img { width: 20px; height: 20px; image-rendering: pixelated; }
    #tip .down { color: #ff8a7a; }
    #tip .hg { color: #ffd27a; }
    button.armed { background: #7a2f28; border-color: #ff8a7a; }
    .chip.heroes { border-color: var(--hero); color: var(--hero); }
    .chip.foes { border-color: var(--foe); color: var(--foe); }
    .chip.now { background: rgba(255,255,255,0.12); font-weight: 600; }
    .spacer { flex: 1; }
    button { font: inherit; color: var(--ink); background: #3a3d55; border: 1px solid #5a5e80; border-radius: 8px; padding: 6px 10px; cursor: pointer; }
    button.primary { background: #6b5a1e; border-color: var(--accent); }
    button.go { background: #2f6b3a; border-color: #8fe39a; font-weight: 600; }
    button.on { background: #7a2f28; border-color: #ff8a7a; }
    button:disabled { opacity: 0.45; cursor: default; }
    button.icon { min-width: 40px; padding: 4px 8px; font-size: 18px; line-height: 1.2; }
    .ab { display: flex; flex-direction: column; align-items: flex-start; min-width: 74px; line-height: 1.15; }
    .ab small { color: var(--quiet); font-size: 11px; }
    .ab.quickToggle { border-color: #e0c060; }
    .ab.quick { background: #3d3a28; border-color: #b49a48; }
    .ab.quick.on { background: #7a2f28; border-color: #ff8a7a; }
    #abilities { display: flex; gap: 6px; flex-wrap: wrap; }
    #hint { flex-basis: 100%; font-size: 12px; color: var(--quiet); }
    /* Floats just above the bottom bar so showing it never shifts the map under the player's finger. */
    #act { position: fixed; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; pointer-events: none; }
    #act button { pointer-events: auto; padding: 10px 18px; font-size: 16px; box-shadow: 0 4px 14px rgba(0,0,0,0.5); }
    #tip { position: fixed; pointer-events: none; background: var(--panel); border: 1px solid #5a5e80; border-radius: 8px; padding: 6px 9px; font-size: 12px; max-width: 240px; display: none; }
    #tip b { color: var(--accent); }
    #tip .quiet { color: var(--quiet); }
    #overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.55); flex-direction: column; gap: 16px; }
    #overlay h1 { margin: 0; font-size: 40px; }
    #mercy { display: flex; flex-direction: column; gap: 8px; align-items: stretch; max-width: min(420px, calc(100vw - 32px)); max-height: 50vh; overflow-y: auto; background: var(--panel); border: 1px solid #5a5e80; border-radius: 12px; padding: 12px; box-shadow: 0 6px 24px rgba(0,0,0,0.6); }
    #mercy:empty { display: none; }
    #mercy h2 { margin: 0; font-size: 18px; text-align: center; }
    #mercy p { margin: 0; font-size: 13px; color: var(--quiet); text-align: center; }
    #mercy .foe { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.06); border-radius: 8px; padding: 6px 8px; }
    #mercy .foe img { width: 32px; height: 32px; image-rendering: pixelated; }
    #mercy .foe span { flex: 1; }
    #mercy .foe button { min-height: 40px; }
    #toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--panel); padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .3s; pointer-events: none; white-space: pre-line; text-align: center; max-width: 90vw; }
    #toast.show { opacity: 1; }
    .esc { color: #ffc85a; }
  .rival { color: #d9a0ff; }
  #travel { position: fixed; inset: 0; display: none; pointer-events: none; z-index: 3; }
  #travel .bar, #runmap .bar { pointer-events: auto; }
  #travelTop { top: 0; padding-top: max(8px, env(safe-area-inset-top)); }
  #travelBottom, #routeBottom { bottom: 0; padding-bottom: max(8px, env(safe-area-inset-bottom)); }
  #runHead { font-size: 13px; } #runHead b { color: var(--accent); }
  #runHint, #routeHint { color: var(--quiet); font-size: 13px; white-space: pre-line; }
  #routeKeys { color: var(--quiet); font-size: 12px; }
  #routeTop { top: 0; padding-top: max(8px, env(safe-area-inset-top)); } #routeTitle { color: var(--accent); }
  #runmap { position: fixed; inset: 0; display: none; pointer-events: none; z-index: 5; }
  body.mapopen #top, body.mapopen #bottom, body.mapopen #act, body.mapopen #travel, body.mapopen #overlay, body.mapopen #tip { display: none !important; }
  #signs { position: absolute; inset: 0; pointer-events: none; }
  .sign { position: absolute; pointer-events: auto; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; gap: 1px;
    padding: 5px 10px 6px; background: #5a3d1f; border: 2px solid #c9934f; border-radius: 6px; box-shadow: 0 3px 0 #2e1d0c, 0 6px 14px rgba(0,0,0,.45); white-space: nowrap; }
  .sign::after { content: ""; position: absolute; top: 100%; left: 50%; width: 5px; height: 16px; margin-left: -2.5px; background: #4a2f15; border-radius: 0 0 2px 2px; }
  .sign b { font-size: 20px; line-height: 1.1; } .sign span { font-size: 12px; color: #ffe9c0; }
  .sign.rival { border-color: #d9a0ff; } .sign.boss { border-color: #ff8a7a; }
  .sign.sel, .sign:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
  #runPanel { position: fixed; inset: 0; z-index: 6; display: none; flex-direction: column; align-items: center; justify-content: safe center; gap: 12px; background: rgba(15, 16, 24, 0.94); padding: 16px; overflow-y: auto; }
  #runPanel .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  #runPanel .say { margin: 0; line-height: 1.45; }
  #runPanel .say, #runPanel pre.stats { max-width: 560px; }
  #runPanel pre.stats { margin: 0; width: min(560px, 100%); white-space: pre-wrap; font-size: 12px; line-height: 1.5; color: var(--quiet); background: rgba(255,255,255,0.04); padding: 10px 12px; border-radius: 8px; }
  #runPanel .say.reply { color: var(--accent); }
  #runPanel .say.down { color: #ff8a7a; }
  #runPanel .say.ending { padding-left: 10px; border-left: 3px solid var(--quiet); }
  #runPanel .say.ending.good { border-color: #7ed957; }
  #runPanel .say.ending.bad { border-color: #ff8a7a; }
  #runHint { white-space: pre-line; }
  #runPanel .spoils { margin: 0; color: var(--quiet); }
  #runPanel h2 { margin: 0; font-size: 20px; color: var(--accent); text-align: center; }
  #runPanel .cards { display: flex; flex-direction: column; gap: 10px; width: min(420px, 100%); }
  #runPanel .card { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left; padding: 10px 12px; }
  #runPanel .card small { color: var(--quiet); font-size: 11px; }
  #runPanel .card em { color: var(--accent); font-style: normal; font-size: 12px; }
  #runPanel .card.worn { border-color: var(--accent); }
  /* Alignment meters: minus side left, plus side right, ticks at 20 and 50. */
  .meters { display: inline-flex; flex-wrap: wrap; gap: 2px 14px; align-items: center; font-size: 11px; color: var(--quiet); }
  .meters .alignName b { color: var(--accent); }
  .meter { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .meter small { font-size: 10px; }
  .meter em { font-style: normal; color: var(--ink); min-width: 2.6em; }
  .meter .track { position: relative; display: inline-block; width: 92px; height: 7px; background: rgba(255,255,255,0.12); border-radius: 4px; }
  .meter .fill { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
  .meter.mercy .fill { background: #7ed957; } .meter.mercy .fill.neg { background: #ff8a7a; }
  .meter.purity .fill { background: #ffe680; } .meter.purity .fill.neg { background: #b0603c; }
  .meter .tick { position: absolute; top: -2px; bottom: -2px; width: 1px; background: rgba(255,255,255,0.35); }
  .meter .tick.sig { background: rgba(255,255,255,0.7); width: 2px; }
  .meter .zero { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--ink); }
  #runPanel .say .meters { font-size: 12px; }
  #runPanel .say .meter .track { width: 120px; }
  #runPanel h3 { margin: 6px 0 0; font-size: 15px; color: var(--accent); }
  #runPanel .card.locked { opacity: 0.6; }
  #runPanel .card.locked em { color: var(--quiet); }
  .tag { display: inline-block; font-size: 10px; font-weight: normal; padding: 1px 6px; margin-left: 4px; border-radius: 8px; vertical-align: middle; color: #15161f; }
  .tag.mercy { background: #7ed957; } .tag.severity { background: #ff8a7a; } .tag.purity { background: #ffe680; } .tag.sap { background: #c07a52; }
  #runPanel .say.ending.hero { border-color: var(--accent); }
  @media (max-width: 420px) { .meter .track { width: 64px; } #runPanel .say .meter .track { width: 84px; } }
  .r-common { color: var(--ink); } .r-rare { color: #7fc4ff; } .r-epic { color: #d9a0ff; }
  #toast { z-index: 7; } #overlay { z-index: 4; }
  #resultNote { color: #ffc85a; margin: 0 16px; text-align: center; }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="top" class="bar">
    <span id="turn"></span><span id="stats"></span>
    <span class="spacer"></span>
    <button id="zoomOut" aria-label="−">−</button><button id="zoomIn" aria-label="+">+</button>
    <button id="rotateL" class="icon"></button><button id="rotateR" class="icon"></button>
    <button id="flat"></button>
    <button id="danger"></button>
    <button id="lang"></button>
    <div id="queue"></div>
  </div>
  <div id="bottom" class="bar">
    <div id="abilities"></div>
    <span class="spacer"></span>
    <button id="rewind"></button>
    <button id="undo"></button>
    <button id="hold"></button>
    <button id="wait"></button>
    <button id="guard"></button>
    <button id="end" class="primary"></button>
    <span id="hint"></span>
  </div>
  <div id="act"><button id="cancel"></button><button id="confirm" class="go"></button></div>
  <div id="tip"></div>
  <div id="overlay"><h1 id="result"></h1><p id="resultNote"></p><div id="mercy"></div><button id="again" class="primary"></button></div>
  <div id="travel">
    <div id="travelTop" class="bar">
      <div id="runHead"></div>
      <span class="spacer"></span>
      <button id="mapBtn"></button><button id="gearBtn"></button><button id="statsBtn"></button><button id="mapLang"></button><button id="newRun"></button>
    </div>
    <div id="signs"></div>
    <div id="travelBottom" class="bar"><span id="runHint"></span><span class="spacer"></span><button id="skipBtn"></button></div>
  </div>
  <div id="runmap">
    <div id="routeTop" class="bar"><b id="routeTitle"></b><span id="routeKeys"></span><span class="spacer"></span><button id="closeMap" class="primary"></button></div>
    <div id="routeBottom" class="bar"><span id="routeHint"></span></div>
  </div>
  <div id="runPanel"></div>
  <div id="toast"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
